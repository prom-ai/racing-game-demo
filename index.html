<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Racer</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.7);
      --road: #181d2b;
      --text: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #172554 0%, #0b1020 40%, #020617 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      width: min(92vw, 900px);
      background: var(--panel);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(148,163,184,0.2);
      font-weight: bold;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .hud span {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#0f172a, #111827);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.75);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid rgba(96, 165, 250, 0.5);
      border-radius: 18px;
      padding: 28px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      min-width: min(90vw, 380px);
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: #7dd3fc;
    }

    .card p {
      margin: 8px 0;
      color: #dbeafe;
      line-height: 1.5;
    }

    button {
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
      <span>Speed: <strong id="speed">1.0x</strong></span>
    </div>
    <canvas id="game" width="900" height="600"></canvas>
  </div>

  <div class="overlay visible" id="overlay">
    <div class="card">
      <h1>Neon Racer</h1>
      <p>Drive through the night traffic.</p>
      <p>Use A/D or arrow keys to change lanes and avoid collisions.</p>
      <button id="startBtn">Start Race</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    const state = {
      running: false,
      score: 0,
      best: Number(localStorage.getItem('neon-racer-best') || 0),
      speed: 1,
      distance: 0,
      spawnTimer: 0,
      pickupTimer: 0,
      roadScroll: 0,
      roadCurve: 0,
      roadShift: 0
    };

    const keys = { left: false, right: false };

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 115,
      width: 56,
      height: 90,
      color: '#38bdf8',
      speed: 7.5,
      drift: 0,
      heading: 0
    };

    let cars = [];
    let pickups = [];

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function laneX(lane) {
      return canvas.width / 2 + (lane - 1.5) * 120;
    }

    function roadHalfAt(y) {
      const horizon = 145;
      const t = clamp((y - horizon) / (canvas.height - horizon), 0, 1);
      return 85 + t * 220;
    }

    function spawnCar() {
      const lane = Math.floor(Math.random() * 3) + 1;
      const x = laneX(lane);
      const car = {
        lane,
        x,
        y: -120,
        width: 52,
        height: 92,
        color: ['#f87171', '#f59e0b', '#a78bfa', '#34d399'][Math.floor(Math.random() * 4)],
        speed: 4.5 + Math.random() * 2.6 + state.speed * 1.15
      };
      cars.push(car);
    }

    function spawnPickup() {
      const lane = Math.floor(Math.random() * 3) + 1;
      const x = laneX(lane);
      pickups.push({
        x,
        y: -40,
        size: 18,
        color: '#facc15',
        spin: Math.random() * Math.PI * 2
      });
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(state.score);
      bestEl.textContent = Math.floor(state.best);
      speedEl.textContent = state.speed.toFixed(1) + 'x';
    }

    function resetGame() {
      state.running = true;
      state.score = 0;
      state.distance = 0;
      state.speed = 1;
      state.spawnTimer = 0.2;
      state.pickupTimer = 2.5;
      state.roadScroll = 0;
      state.roadCurve = 0;
      state.roadShift = 0;
      cars = [];
      pickups = [];

      player.x = canvas.width / 2;
      player.y = canvas.height - 115;
      player.drift = 0;
      player.heading = 0;

      overlay.classList.remove('visible');
      updateHud();
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function circleRectCollision(circle, rect) {
      const closestX = clamp(circle.x, rect.x, rect.x + rect.width);
      const closestY = clamp(circle.y, rect.y, rect.y + rect.height);
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return (dx * dx + dy * dy) < (circle.size * circle.size);
    }

    function endGame() {
      state.running = false;
      state.best = Math.max(state.best, state.score);
      localStorage.setItem('neon-racer-best', String(Math.floor(state.best)));

      overlay.classList.add('visible');
      overlay.querySelector('h1').textContent = 'Crash!';
      overlay.querySelector('p').textContent = 'You scored ' + Math.floor(state.score) + ' points. Press Start to race again.';
      startBtn.textContent = 'Restart Race';
      updateHud();
    }

    function handleInput() {
      if (keys.left) {
        player.x -= player.speed * 1.3;
        player.heading = -0.15;
      }
      if (keys.right) {
        player.x += player.speed * 1.3;
        player.heading = 0.15;
      }

      if (!keys.left && !keys.right) {
        player.heading *= 0.82;
      }

      const roadLeft = canvas.width / 2 - roadHalfAt(canvas.height - 60) - 24;
      const roadRight = canvas.width / 2 + roadHalfAt(canvas.height - 60) + 24;
      player.x = clamp(player.x, roadLeft + 20, roadRight - 20);
      player.drift = player.heading * 26;
    }

    function update(dt) {
      if (!state.running) return;

      state.distance += dt * 0.12;
      state.score += dt * 0.9 + state.speed * 0.7;
      state.speed = 1 + Math.min(4, state.distance / 1400);
      state.roadScroll += dt * (10 + state.speed * 4.5);
      state.roadCurve += dt * 0.75;
      state.roadShift = Math.sin(state.roadCurve) * 38;

      state.spawnTimer -= dt;
      state.pickupTimer -= dt;

      if (state.spawnTimer <= 0) {
        spawnCar();
        state.spawnTimer = Math.max(0.8, 1.5 - state.speed * 0.18) * (0.75 + Math.random() * 0.8);
      }

      if (state.pickupTimer <= 0) {
        spawnPickup();
        state.pickupTimer = Math.max(2.2, 4.7 - state.speed * 0.45);
      }

      handleInput();

      for (let i = cars.length - 1; i >= 0; i--) {
        const c = cars[i];
        c.y += (4 + state.speed * 2.6) * dt * 60;

        if (c.y > canvas.height + 120) {
          cars.splice(i, 1);
          continue;
        }

        const carRect = {
          x: c.x - c.width / 2,
          y: c.y - c.height / 2,
          width: c.width,
          height: c.height
        };

        const playerRect = {
          x: player.x - player.width / 2,
          y: player.y - player.height / 2,
          width: player.width,
          height: player.height
        };

        if (rectsOverlap(playerRect, carRect)) {
          endGame();
          return;
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += (4 + state.speed * 2.2) * dt * 60;
        p.spin += dt * 6;

        const pickupCircle = {
          x: p.x,
          y: p.y,
          size: p.size
        };

        const playerRect = {
          x: player.x - player.width / 2,
          y: player.y - player.height / 2,
          width: player.width,
          height: player.height
        };

        if (circleRectCollision(pickupCircle, playerRect)) {
          state.score += 25;
          pickups.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height + 40) {
          pickups.splice(i, 1);
        }
      }

      updateHud();
    }

    function drawBackground() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#07111d');
      skyGrad.addColorStop(0.35, '#11263d');
      skyGrad.addColorStop(0.74, '#1f2a36');
      skyGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
      for (let i = 0; i < 18; i++) {
        const x = (i * 73 + (state.roadScroll * 0.4)) % (canvas.width + 100) - 50;
        const h = 22 + (i % 6) * 18;
        ctx.fillRect(x, 120 + (i % 4) * 20, 28, h);
      }

      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      for (let i = 0; i < 20; i++) {
        const x = (i * 90 + (state.roadScroll * 0.2)) % (canvas.width + 80) - 40;
        const w = 38 + (i % 3) * 18;
        const h = 60 + (i % 4) * 20;
        ctx.fillRect(x, 135 + (i % 3) * 25, w, h);
      }

      ctx.beginPath();
      ctx.fillStyle = '#1f2937';
      ctx.moveTo(0, 220);
      ctx.lineTo(canvas.width * 0.2, 120);
      ctx.lineTo(canvas.width * 0.8, 120);
      ctx.lineTo(canvas.width, 220);
      ctx.lineTo(canvas.width, 260);
      ctx.lineTo(0, 260);
      ctx.closePath();
      ctx.fill();
    }

    function drawRoad() {
      const roadTop = 150;
      const roadBottom = canvas.height;
      const widthTop = 160;
      const widthBottom = 560;

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 - widthTop / 2 + state.roadShift * 0.3, roadTop);
      ctx.lineTo(canvas.width / 2 + widthTop / 2 + state.roadShift * 0.3, roadTop);
      ctx.lineTo(canvas.width / 2 + widthBottom / 2 + state.roadShift, roadBottom);
      ctx.lineTo(canvas.width / 2 - widthBottom / 2 + state.roadShift, roadBottom);
      ctx.closePath();

      const roadGrad = ctx.createLinearGradient(0, roadTop, 0, roadBottom);
      roadGrad.addColorStop(0, '#3f3f46');
      roadGrad.addColorStop(0.4, '#1f2937');
      roadGrad.addColorStop(1, '#111827');
      ctx.fillStyle = roadGrad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.lineWidth = 18;
      ctx.stroke();

      const laneCount = 3;
      const leftEdgeX1 = canvas.width / 2 - widthTop / 2 + state.roadShift * 0.3;
      const leftEdgeX2 = canvas.width / 2 - widthBottom / 2 + state.roadShift;
      const rightEdgeX1 = canvas.width / 2 + widthTop / 2 + state.roadShift * 0.3;
      const rightEdgeX2 = canvas.width / 2 + widthBottom / 2 + state.roadShift;

      for (let i = 1; i < laneCount; i++) {
        const t = i / laneCount;
        const x1 = leftEdgeX1 + (rightEdgeX1 - leftEdgeX1) * t;
        const x2 = leftEdgeX2 + (rightEdgeX2 - leftEdgeX2) * t;

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 3;
        ctx.setLineDash([18, 26]);
        for (let y = roadTop; y < roadBottom; y += 26) {
          const yy = y + (state.roadScroll * 1.4) % 26;
          const x = x1 + (x2 - x1) * ((yy - roadTop) / (roadBottom - roadTop));
          if (yy - roadTop < 0) continue;
          ctx.moveTo(x, yy);
          ctx.lineTo(x, yy + 16);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);

      for (let i = 0; i < 10; i++) {
        const y = i * 58 + (state.roadScroll * 1.7 % 58);
        ctx.fillStyle = '#f8fafc';
        const xA = leftEdgeX1 + (leftEdgeX2 - leftEdgeX1) * ((y - roadTop) / (roadBottom - roadTop));
        const xB = rightEdgeX1 + (rightEdgeX2 - rightEdgeX1) * ((y - roadTop) / (roadBottom - roadTop));
        const width = 8;
        ctx.fillRect(xA - width / 2, y, width, 26);
        ctx.fillRect(xB - width / 2, y, width, 26);
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(player.heading);

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.fillRect(-26, 18, 52, 74);

      ctx.fillStyle = player.color;
      ctx.fillRect(-28, -32, 56, 72);
      ctx.fillStyle = 'rgba(241, 245, 249, 0.7)';
      ctx.fillRect(-16, -18, 32, 18);

      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-18, -40, 8, 10);
      ctx.fillRect(10, -40, 8, 10);

      ctx.fillStyle = '#fb7185';
      ctx.fillRect(-18, 38, 8, 10);
      ctx.fillRect(10, 38, 8, 10);

      ctx.restore();
    }

    function drawCars() {
      cars.forEach(car => {
        const x = car.x;
        const y = car.y;

        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(-22, 12, 44, 76);

        ctx.fillStyle = car.color;
        ctx.fillRect(-26, -32, 52, 76);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillRect(-16, -18, 32, 18);

        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-16, -38, 8, 10);
        ctx.fillRect(8, -38, 8, 10);

        ctx.fillStyle = '#fb7185';
        ctx.fillRect(-16, 38, 8, 10);
        ctx.fillRect(8, 38, 8, 10);
        ctx.restore();
      });
    }

    function drawPickups() {
      pickups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.fillStyle = '#fff7b2';
        ctx.fillRect(-p.size / 4, -p.size / 4, p.size / 2, p.size / 2);
        ctx.restore();
      });
    }

    function drawRoadsideLights() {
      for (let i = 0; i < 20; i++) {
        const t = i / 20;
        const y = 160 + t * (canvas.height - 160);
        const xLeft = canvas.width / 2 - 270 + Math.sin((y + state.roadScroll) * 0.08) * 18;
        const xRight = canvas.width / 2 + 270 + Math.sin((y + state.roadScroll * 1.2) * 0.06) * 18;

        ctx.fillStyle = 'rgba(250, 204, 21, 0.5)';
        ctx.fillRect(xLeft, y, 5, 10);
        ctx.fillRect(xRight, y, 5, 10);
      }
    }

    function drawStartHint() {
      if (!state.running) return;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 17px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Swerve through the traffic and grab power-ups', canvas.width / 2, 40);
    }

    function render() {
      drawBackground();
      drawRoad();
      drawRoadsideLights();
      drawPickups();
      drawCars();
      drawPlayer();
      drawStartHint();
    }

    let lastTime = 0;

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
      lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
      if ((e.key === ' ' || e.key === 'Enter') && !state.running) resetGame();
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
    });

    startBtn.addEventListener('click', () => {
      resetGame();
    });

    updateHud();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
