<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Circuit</title>
  <style>
    :root {
      --bg: #060b16;
      --panel: rgba(15, 23, 42, 0.76);
      --text: #e2e8f0;
      --accent: #7dd3fc;
      --accent-2: #38bdf8;
      --danger: #f87171;
      --good: #34d399;
      --gold: #facc15;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #172554, #020617 55%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .shell {
      width: min(94vw, 980px);
      background: var(--panel);
      border: 2px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .boost-track {
      width: 160px;
      height: 14px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .boost-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #facc15, #f87171);
      border-radius: inherit;
      transition: width 0.08s linear;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(#020617, #111827);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(2, 6, 23, 0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-radius: 18px;
      padding: 28px 30px;
      min-width: min(90vw, 420px);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--accent);
    }

    .card p {
      margin: 8px 0;
      color: #dbeafe;
      line-height: 1.5;
    }

    .card .meta {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #cbd5e1;
      flex-wrap: wrap;
    }

    button {
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hud">
      <div class="hud-item">Lap <strong id="lapText">1 / 3</strong></div>
      <div class="hud-item">Time <strong id="timerText">00:00</strong></div>
      <div class="hud-item">Best <strong id="bestText">00:00</strong></div>
      <div class="hud-item">Speed <strong id="speedText">0 km/h</strong></div>
      <div class="hud-item">Nitro
        <div class="boost-track"><div id="boostFill" class="boost-fill"></div></div>
      </div>
    </div>
    <canvas id="game" width="960" height="620"></canvas>
  </div>

  <div id="overlay" class="overlay visible">
    <div class="card">
      <h1>Turbo Circuit</h1>
      <p>Race through 3 laps, dodge traffic, and use nitro to win.</p>
      <div class="meta">
        <span>Move: A / D or ← / →</span>
        <span>Boost: Shift</span>
      </div>
      <button id="startBtn">Start Race</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const lapText = document.getElementById('lapText');
    const timerText = document.getElementById('timerText');
    const bestText = document.getElementById('bestText');
    const speedText = document.getElementById('speedText');
    const boostFill = document.getElementById('boostFill');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    const LAPS = 3;
    const RACE_DISTANCE = 3200;
    const road = {
      horizon: 110,
      widthTop: 170,
      widthBottom: 560
    };

    const state = {
      running: false,
      startTime: 0,
      elapsed: 0,
      bestLap: null,
      lap: 1,
      totalDistance: 0,
      speed: 0,
      maxSpeed: 320,
      nitro: 100,
      boostActive: false,
      finished: false
    };

    const keys = { left: false, right: false, boost: false };

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 115,
      width: 56,
      height: 94,
      targetX: canvas.width / 2,
      drift: 0,
      color: '#38bdf8'
    };

    let enemies = [];
    let pickups = [];
    let particles = [];

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const ms = Math.floor((seconds % 1) * 100);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function roadHalfAt(y) {
      const t = clamp((y - road.horizon) / (canvas.height - road.horizon), 0, 1);
      return lerp(road.widthTop / 2, road.widthBottom / 2, t);
    }

    function roadCenterAt(y) {
      return canvas.width / 2;
    }

    function laneXForWorld(worldX) {
      const roadHalf = roadHalfAt(canvas.height - 80);
      return canvas.width / 2 + worldX * roadHalf * 0.95;
    }

    function worldToScreenX(worldX, y) {
      const roadCenter = roadCenterAt(y);
      const half = roadHalfAt(y);
      return roadCenter + worldX * half;
    }

    function roadPosFromX(screenX, y) {
      const half = roadHalfAt(y);
      return ((screenX - canvas.width / 2) / half);
    }

    function randomLane() {
      return (Math.random() * 2 - 1) * 0.9;
    }

    function spawnEnemy() {
      const lane = randomLane();
      enemies.push({
        lane,
        x: worldToScreenX(lane, 50),
        y: -120,
        width: 54,
        height: 90,
        color: ['#f87171', '#f59e0b', '#a78bfa', '#34d399'][Math.floor(Math.random() * 4)],
        speed: 140 + Math.random() * 100 + state.speed * 0.45,
        drift: (Math.random() - 0.5) * 0.25,
        wobble: Math.random() * Math.PI * 2
      });
    }

    function spawnPickup() {
      pickups.push({
        x: canvas.width / 2 + (Math.random() * 2 - 1) * 160,
        y: -40,
        size: 18,
        spin: Math.random() * Math.PI * 2,
        type: 'nitro'
      });
    }

    function updateHud() {
      lapText.textContent = `${state.lap} / ${LAPS}`;
      timerText.textContent = formatTime(state.elapsed);
      bestText.textContent = state.bestLap === null ? '00:00' : formatTime(state.bestLap);
      speedText.textContent = `${Math.round(state.speed * 0.72)} km/h`;
      boostFill.style.width = `${state.nitro}%`;
    }

    function resetGame() {
      state.running = true;
      state.startTime = performance.now();
      state.elapsed = 0;
      state.totalDistance = 0;
      state.speed = 80;
      state.nitro = 100;
      state.boostActive = false;
      state.finished = false;
      state.lap = 1;
      enemies = [];
      pickups = [];
      particles = [];

      player.x = canvas.width / 2;
      player.targetX = canvas.width / 2;
      player.drift = 0;

      for (let i = 0; i < 9; i++) spawnEnemy();
      for (let i = 0; i < 4; i++) spawnPickup();

      overlay.classList.remove('visible');
      updateHud();
    }

    function finishRace() {
      state.running = false;
      state.finished = true;

      const lastLap = state.elapsed;
      if (state.bestLap === null || lastLap < state.bestLap) {
        state.bestLap = lastLap;
      }

      overlay.classList.add('visible');
      overlay.querySelector('h1').textContent = 'Race Complete!';
      overlay.querySelector('p').textContent = `Finished in ${formatTime(state.elapsed)}. Press Start to race again.`;
      startBtn.textContent = 'Race Again';
      updateHud();
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 90,
          vy: (Math.random() - 0.5) * 90,
          r: 2 + Math.random() * 3,
          color,
          life: 0.7 + Math.random() * 0.5
        });
      }
    }

    function update(dt) {
      if (!state.running) return;

      state.elapsed += dt;

      if (keys.left) player.targetX -= 260 * dt;
      if (keys.right) player.targetX += 260 * dt;
      if (keys.boost && state.nitro > 2) {
        state.boostActive = true;
        state.nitro -= 28 * dt;
        state.speed += 170 * dt;
      } else {
        state.boostActive = false;
        state.nitro = clamp(state.nitro + 14 * dt, 0, 100);
      }

      const roadLeft = canvas.width / 2 - roadHalfAt(canvas.height - 80);
      const roadRight = canvas.width / 2 + roadHalfAt(canvas.height - 80);
      player.targetX = clamp(player.targetX, roadLeft + 28, roadRight - 28);
      player.x = lerp(player.x, player.targetX, 0.18);
      player.drift = (player.x - player.targetX) * 0.25;

      const baseSpeed = 130;
      const accel = 55;
      const maxSpeed = state.boostActive ? 420 : 280;
      state.speed = lerp(state.speed, baseSpeed + (state.boostActive ? 180 : 0), 0.04);
      state.speed = clamp(state.speed + accel * dt, 0, maxSpeed);

      state.totalDistance += state.speed * dt * 0.65;

      if (state.totalDistance >= RACE_DISTANCE * state.lap) {
        if (state.lap < LAPS) {
          state.lap += 1;
          state.totalDistance = 0;
          state.speed = 150;
          addParticles(canvas.width / 2, canvas.height / 2, '#7dd3fc', 18);
        } else {
          finishRace();
          return;
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += (state.speed * 0.75 + e.speed) * dt;
        e.wobble += dt * 1.8;
        e.x = lerp(e.x, worldToScreenX(e.lane + Math.sin(e.wobble) * 0.12, e.y), 0.08);

        if (e.y > canvas.height + 120) {
          enemies.splice(i, 1);
          spawnEnemy();
        }

        const r1 = {
          x: player.x - player.width / 2,
          y: player.y - player.height / 2,
          width: player.width,
          height: player.height
        };

        const r2 = {
          x: e.x - e.width / 2,
          y: e.y - e.height / 2,
          width: e.width,
          height: e.height
        };

        if (
          r1.x < r2.x + r2.width &&
          r1.x + r1.width > r2.x &&
          r1.y < r2.y + r2.height &&
          r1.y + r1.height > r2.y
        ) {
          state.running = false;
          overlay.classList.add('visible');
          overlay.querySelector('h1').textContent = 'Crash!';
          overlay.querySelector('p').textContent = `You reached ${formatTime(state.elapsed)}. Press Start to try again.`;
          startBtn.textContent = 'Retry';
          addParticles(player.x, player.y, '#f87171', 28);
          return;
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.y += (state.speed * 0.9 + 120) * dt;
        p.spin += dt * 8;

        const pickupRect = {
          x: p.x - p.size,
          y: p.y - p.size,
          width: p.size * 2,
          height: p.size * 2
        };

        const playerRect = {
          x: player.x - player.width / 2,
          y: player.y - player.height / 2,
          width: player.width,
          height: player.height
        };

        if (
          pickupRect.x < playerRect.x + playerRect.width &&
          pickupRect.x + pickupRect.width > playerRect.x &&
          pickupRect.y < playerRect.y + playerRect.height &&
          pickupRect.y + pickupRect.height > playerRect.y
        ) {
          state.nitro = clamp(state.nitro + 30, 0, 100);
          pickups.splice(i, 1);
          addParticles(p.x, p.y, '#facc15', 14);
          continue;
        }

        if (p.y > canvas.height + 40) {
          pickups.splice(i, 1);
          spawnPickup();
        }
      }

      if (Math.random() < 0.02) spawnPickup();
      if (Math.random() < 0.03) spawnEnemy();

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateHud();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#020b18');
      sky.addColorStop(0.5, '#111827');
      sky.addColorStop(1, '#1f2937');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
      for (let i = 0; i < 28; i++) {
        const x = (i * 71 + (state.elapsed * 30) % 80) % (canvas.width + 100) - 50;
        const h = 18 + (i % 4) * 20;
        ctx.fillRect(x, 90 + (i % 7) * 18, 28, h);
      }

      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      for (let i = 0; i < 15; i++) {
        const x = (i * 90 + (state.elapsed * 20) % 90) % (canvas.width + 120) - 60;
        const w = 32 + (i % 3) * 16;
        const h = 50 + (i % 5) * 18;
        ctx.fillRect(x, 140 + (i % 3) * 30, w, h);
      }
    }

    function drawRoad() {
      const topWidth = 170;
      const bottomWidth = 560;
      const top = road.horizon;
      const bottom = canvas.height;

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 - topWidth / 2, top);
      ctx.lineTo(canvas.width / 2 + topWidth / 2, top);
      ctx.lineTo(canvas.width / 2 + bottomWidth / 2, bottom);
      ctx.lineTo(canvas.width / 2 - bottomWidth / 2, bottom);
      ctx.closePath();

      const roadGrad = ctx.createLinearGradient(0, top, 0, bottom);
      roadGrad.addColorStop(0, '#3f3f46');
      roadGrad.addColorStop(0.4, '#1f2937');
      roadGrad.addColorStop(1, '#111827');
      ctx.fillStyle = roadGrad;
      ctx.fill();

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
      ctx.lineWidth = 18;
      ctx.stroke();

      for (let i = 1; i < 3; i++) {
        const t1 = i / 3;
        const x1 = canvas.width / 2 - topWidth / 2 + (topWidth * t1);
        const x2 = canvas.width / 2 - bottomWidth / 2 + (bottomWidth * t1);

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 24]);
        for (let y = top; y < bottom; y += 26) {
          const p = (y - top) / (bottom - top);
          const x = lerp(x1, x2, p);
          const nextY = y + 16;
          const p2 = (nextY - top) / (bottom - top);
          const nx = lerp(x1, x2, p2);
          ctx.moveTo(x, y);
          ctx.lineTo(nx, nextY);
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(250, 204, 21, 0.6)';
      for (let i = 0; i < 20; i++) {
        const y = 155 + i * 26 + ((state.elapsed * 90) % 26);
        ctx.fillRect(canvas.width / 2 - 270 + Math.sin(y * 0.15) * 24, y, 5, 12);
        ctx.fillRect(canvas.width / 2 + 270 + Math.sin(y * 0.17) * 28, y, 5, 12);
      }
    }

    function drawCar(x, y, width, height, color, heading = 0, shadow = true) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(heading);
      if (shadow) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
        ctx.fillRect(-width / 2 - 6, height / 2 - 10, width + 12, 16);
      }

      ctx.fillStyle = color;
      ctx.fillRect(-width / 2, -height / 2, width, height);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(-width / 2 + 9, -height / 2 + 10, width - 18, 18);

      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(-width / 2 + 8, -height / 2 - 8, 10, 10);
      ctx.fillRect(width / 2 - 18, -height / 2 - 8, 10, 10);

      ctx.fillStyle = '#fb7185';
      ctx.fillRect(-width / 2 + 8, height / 2 - 8, 10, 8);
      ctx.fillRect(width / 2 - 18, height / 2 - 8, 10, 8);
      ctx.restore();
    }

    function drawPickup(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      ctx.fillStyle = '#facc15';
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.fillStyle = '#fff7b2';
      ctx.fillRect(-p.size / 4, -p.size / 4, p.size / 2, p.size / 2);
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      drawBackground();
      drawRoad();

      for (const p of pickups) drawPickup(p);
      for (const e of enemies) drawCar(e.x, e.y, e.width, e.height, e.color, 0, true);

      const heading = (player.x - player.targetX) * 0.06;
      drawCar(player.x, player.y, player.width, player.height, player.color, heading, true);
      drawParticles();
    }

    let lastTime = 0;

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.033);
      lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'a' || e.key === 'ArrowLeft') keys.left = true;
      if (key === 'd' || e.key === 'ArrowRight') keys.right = true;
      if (key === 'shift') keys.boost = true;
      if ((e.key === ' ' || e.key === 'Enter') && !state.running) resetGame();
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'a' || e.key === 'ArrowLeft') keys.left = false;
      if (key === 'd' || e.key === 'ArrowRight') keys.right = false;
      if (key === 'shift') keys.boost = false;
    });

    startBtn.addEventListener('click', () => {
      resetGame();
    });

    updateHud();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
